<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的待办清单</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>我的待办清单</h1>
        <p class="subtitle">数据保存在浏览器本地，关掉页面也不会丢</p>
      </header>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="今天要做什么？"
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit">添加</button>
      </form>

      <div class="filters">
        <button class="filter is-active" type="button" data-filter="all">全部</button>
        <button class="filter" type="button" data-filter="active">未完成</button>
        <button class="filter" type="button" data-filter="done">已完成</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <footer class="todo-footer">
        <span id="todo-count">共 0 项</span>
        <button id="clear-done" type="button" class="link-button">清除已完成</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
